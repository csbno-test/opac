<style>
.frasi-rotanti {
  position: relative;
  width: 100%;
  min-height: 80px;
  overflow: hidden;
  font-family: "DM Sans", Arial, sans-serif;
  font-size: clamp(14px, 2vw, 20px);
  line-height: 1.35;
  color: #1e2a38;
}

.frasi-rotanti .frase {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  opacity: 0;
  animation-name: rotazioneFrasi;
  animation-duration: 20s;
  animation-iteration-count: infinite;
}

.frasi-rotanti .frase:nth-child(1) {
  animation-delay: 0s;
}

.frasi-rotanti .frase:nth-child(2) {
  animation-delay: 5s;
}

.frasi-rotanti .frase:nth-child(3) {
  animation-delay: 10s;
}

.frasi-rotanti .frase:nth-child(4) {
  animation-delay: 15s;
}

.frasi-rotanti .frase a {
  color: #2e86c1;
  text-decoration: none;
  font-weight: 700;
}

@keyframes rotazioneFrasi {
  0% {
    opacity: 0;
    transform: translateY(8px);
  }

  5% {
    opacity: 1;
    transform: translateY(0);
  }

  22% {
    opacity: 1;
    transform: translateY(0);
  }

  27% {
    opacity: 0;
    transform: translateY(-8px);
  }

  100% {
    opacity: 0;
    transform: translateY(-8px);
  }
}
</style>
