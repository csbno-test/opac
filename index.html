<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">

<style>
html, body {
  margin: 0;
  padding: 0;
  overflow: hidden;
  background: transparent;
  font-family: "Helvetica Neue", sans-serif;
}

.rotazione-link {
  position: relative;
  width: 100%;
  height: 42px;
  overflow: hidden;
}

.frase {
  position: absolute;
  inset: 0;
  width: 100%;
  font-size: 14px;
  font-weight: bold;
  color: #000;
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  animation: rotazione 18s infinite;
  line-height: 42px;
  white-space: nowrap;
  text-align: left;
}

.frase:nth-child(1) {
  animation-delay: 0s;
}

.frase:nth-child(2) {
  animation-delay: 6s;
}

.frase:nth-child(3) {
  animation-delay: 12s;
}

.frase a {
  color: #DC0C14;
  text-decoration: none;
  font-weight: bold;
}

.frase a:hover {
  text-decoration: underline;
}

@keyframes rotazione {

  0% {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }

  6% {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
  }

  27% {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
  }

  33% {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }

  100% {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }
}
</style>
</head>

<body>

<div class="rotazione-link">

  <div class="frase">
    Scopri i nuovi viaggi di 
    <a href="https://webopac.csbno.net/home/percorrendo-l-arte/" target="_blank">
      Percorrendo l'Arte
    </a>
  </div>

  <div class="frase">
    <a href="https://csbno.cosedafare.net/corsi/scienze-sociali/economia/fondi-pensione-welfare-quali-opportunita-lavoratori-aziende-5880.html" target="_blank">
      Fondi pensione e welfare:
    </a>
    incontro gratuito in CSBNO
  </div>

  <div class="frase">
    E' attiva la promo +TECA per il
    <a href="https://viewstripo.email/template/d61e3cf2-d146-4672-8001-93f8f2e143d2" target="_blank">
      Festival di Villa Arconati
    </a>
  </div>

</div>

</body>
</html>
