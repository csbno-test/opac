<style>
.frasi-rotanti {
  position: relative;
  width: 100%;
  min-height: 35px;
  overflow: hidden;
  font-family: "DM Sans", Arial, sans-serif;
  font-size: clamp(13px, 1.7vw, 18px);
  line-height: 1.35;
  color: #1e2a38;
}

.frasi-rotanti .frase {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  animation: rotazioneFrasi 12s infinite;
}

.frasi-rotanti .frase:nth-child(1) {
  animation-delay: 0s;
}

.frasi-rotanti .frase:nth-child(2) {
  animation-delay: 6s;
}

.frasi-rotanti .frase a {
  color: #2e86c1;
  text-decoration: none;
  font-weight: 700;
}

.frasi-rotanti .frase a:hover {
  text-decoration: underline;
}

@keyframes rotazioneFrasi {

  0% {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transform: translateY(4px);
  }

  2% {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
    transform: translateY(0);
  }

  48% {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
    transform: translateY(0);
  }

  50% {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transform: translateY(-4px);
  }

  100% {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transform: translateY(-4px);
  }
}
</style>
