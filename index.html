
<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
html, body {
  margin: 0;
  padding: 0;
  overflow: hidden;
  background: transparent;
}

.frasi-rotanti {
  position: relative;
  width: 100%;
  height: 35px;
  overflow: hidden;
  font-family: "DM Sans", "Segoe UI", Arial, sans-serif;
  font-size: clamp(15px, 1.8vw, 20px);
  line-height: 35px;
  color: #1e2a38;
}

.frase {
  position: absolute;
  inset: 0;
  width: 100%;
  white-space: nowrap;
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  animation: rotazioneFrasi 18s infinite;
}

/* Tre frasi, una ogni 6 secondi */

.frase:nth-child(1) {
  animation-delay: 0s;
}

.frase:nth-child(2) {
  animation-delay: 6s;
}

.frase:nth-child(3) {
  animation-delay: 12s;
}

/* Freccia */

.freccia {
  color: #dc0c14;
  font-weight: 700;
  margin-right: 10px;
}

/* Collegamenti */

.frase a {
  color: #2e86c1;
  text-decoration: none;
  font-weight: 700;
}

.frase a:hover,
.frase a:focus-visible {
  text-decoration: underline;
}

/* Rotazione senza sovrapposizioni */

@keyframes rotazioneFrasi {
  0% {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transform: translateY(3px);
  }

  1% {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
    transform: translateY(0);
  }

  32.333% {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
    transform: translateY(0);
  }

  33.333% {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transform: translateY(-3px);
  }

  100% {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transform: translateY(-3px);
  }
}
</style>
</head>

<body>

<div class="frasi-rotanti">

  <!-- FRASE 1 -->
  <div class="frase">
    <span class="freccia">➜</span>
    <a href="https://csbno.cosedafare.net/corsi/scienze-sociali/economia/educare-futuro-6111.html"
       target="_blank" rel="noopener noreferrer">
      Educare al futuro:
    </a>
    per genitori e insegnanti
  </div>

  <!-- FRASE 2 -->
  <div class="frase">
    <span class="freccia">➜</span>
    <a href="https://csbno.cosedafare.net/Corsi/Intelligenza%20artificiale"
       target="_blank" rel="noopener noreferrer">
      Intelligenza artificiale:
    </a>
    nuovi corsi in partenza
  </div>

  <!-- FRASE 3 -->
  <div class="frase">
    <span class="freccia">➜</span>
    <a href="https://webopac.csbno.net/home/il-diritto-di-leggere/"
       target="_blank" rel="noopener noreferrer">
      Il diritto di leggere:
    </a>
    accessibilità comunicativa e letture inclusive
  </div>

</div>

</body>
</html>
