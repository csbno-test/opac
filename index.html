<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<style>
html, body {
  margin: 0;
  padding: 0;
  overflow: hidden;
  background: transparent;
}

.frasi-rotanti {
  position: relative;
  width: 100%;
  height: 35px;
  overflow: hidden;
  font-family: "DM Sans", Arial, sans-serif;
  font-size: clamp(13px, 1.7vw, 18px);
  line-height: 35px;
  color: #1e2a38;
}

.frase {
  position: absolute;
  inset: 0;
  width: 100%;
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  animation: rotazioneFrasi 18s infinite;
  white-space: nowrap;
}

.frase:nth-child(1) {
  animation-delay: 0s;
}

.frase:nth-child(2) {
  animation-delay: 6s;
}

.frase:nth-child(3) {
  animation-delay: 6s;
}

.freccia {
  color: #dc0c14;
  font-weight: 700;
  margin-right: 10px;
}

.frase a {
  color: #2e86c1;
  text-decoration: none;
  font-weight: 700;
}

.frase a:hover {
  text-decoration: underline;
}

@keyframes rotazioneFrasi {
  0% {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transform: translateY(4px);
  }

  2% {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
    transform: translateY(0);
  }

  48% {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
    transform: translateY(0);
  }

  50% {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transform: translateY(-4px);
  }

  100% {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transform: translateY(-4px);
  }
}
</style>
</head>

<body>

<div class="frasi-rotanti">

  <div class="frase">
    <span class="freccia">➜</span>
    <a href="https://csbno.cosedafare.net/corsi/gratuiti" target="_blank">
      Open day e presentazioni:
    </a>
    da settembre in biblioteca
  </div>

  <div class="frase">
    <span class="freccia">➜</span>
    <a href="https://csbno.cosedafare.net/corsi/intelligenza-artificiale/intelligenza-artificiale/intelligenza-artificiale-tre-prospettive-capire-cambiamento-6034.html" target="_blank">
      Intelligenza artificiale:
    </a>
    incontro gratuito in CSBNO
  </div>

   <div class="frase">
    <span class="freccia">➜</span>
    <a href="https://comune.sestosangiovanni.mi.it/it/events/event/1156/raga-ci-sono-un-sacco-di-cose-da-fare" target="_blank">
      Attività per giovani 18-34 anni:
    </a>
    progetto RAGA 2 - reaload AGA PLUS
  </div>

</div>

</body>
</html>
