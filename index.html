<style>
.frasi-rotanti {
  position: relative;
  width: 100%;
  min-height: 76px;
  overflow: hidden;
  font-family: "DM Sans", sans-serif;
  font-size: 24px;
  line-height: 1.4;
  color: #1e2a38;
}

.frasi-rotanti .frase {
  position: absolute;
  inset: 0;
  opacity: 0;
  transform: translateY(12px);
  animation: rotazioneFrasi 20s infinite;
  white-space: normal;
  overflow-wrap: break-word;
}

.frasi-rotanti .frase:nth-child(1) {
  animation-delay: 0s;
}

.frasi-rotanti .frase:nth-child(2) {
  animation-delay: 5s;
}

.frasi-rotanti .frase:nth-child(3) {
  animation-delay: 10s;
}

.frasi-rotanti .frase:nth-child(4) {
  animation-delay: 15s;
}

.frasi-rotanti .frase a {
  color: #2e86c1;
  text-decoration: none;
  font-weight: 700;
}

.frasi-rotanti .frase a:hover {
  color: #f5881f;
}

@media (max-width: 600px) {
  .frasi-rotanti {
    min-height: 110px;
    font-size: 21px;
    line-height: 1.35;
  }
}

@keyframes rotazioneFrasi {
  0% {
    opacity: 0;
    transform: translateY(12px);
  }

  5% {
    opacity: 1;
    transform: translateY(0);
  }

  22% {
    opacity: 1;
    transform: translateY(0);
  }

  27% {
    opacity: 0;
    transform: translateY(-12px);
  }

  100% {
    opacity: 0;
    transform: translateY(-12px);
  }
}
</style>
