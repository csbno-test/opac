<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">

<style>
html, body {
  margin: 0;
  padding: 0;
  overflow: hidden;
  background: transparent;
}

.frasi-rotanti {
  position: relative;
  width: 100%;
  height: 35px;
  overflow: hidden;
  font-family: "DM Sans", Arial, sans-serif;
  font-size: clamp(13px, 1.7vw, 18px);
  line-height: 35px;
  color: #1e2a38;
}

.frase {
  position: absolute;
  inset: 0;
  width: 100%;
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  white-space: nowrap;

  /* 4 frasi × 6 secondi */
  animation: rotazioneFrasi 24s infinite;
}

/* FRASE 1 */
.frase:nth-child(1) {
  animation-delay: 0s;
}

/* FRASE 2 */
.frase:nth-child(2) {
  animation-delay: 6s;
}

/* FRASE 3 */
.frase:nth-child(3) {
  animation-delay: 12s;
}

/* FRASE 4 */
.frase:nth-child(4) {
  animation-delay: 18s;
}

.freccia {
  color: #dc0c14;
  font-weight: 700;
  margin-right: 10px;
}

.frase a {
  color: #2e86c1;
  text-decoration: none;
  font-weight: 700;
}

.frase a:hover {
  text-decoration: underline;
}

/*
  Ogni frase occupa circa il 25% del ciclo.
  Entrata e uscita sono molto rapide per
  evitare sovrapposizioni e lunghi spazi vuoti.
*/

@keyframes rotazioneFrasi {

  0% {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transform: translateY(4px);
  }

  1% {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
    transform: translateY(0);
  }

  24% {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
    transform: translateY(0);
  }

  25% {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transform: translateY(-4px);
  }

  100% {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transform: translateY(-4px);
  }
}
</style>
</head>

<body>

<div class="frasi-rotanti">

  <!-- FRASE 1 -->
  <div class="frase">
    <span class="freccia">➜</span>
    <a href="https://csbno.cosedafare.net/corsi/gratuiti" target="_blank">
      Open day e presentazioni:
    </a>
    da settembre in biblioteca
  </div>


  <!-- FRASE 2 -->
  <div class="frase">
    <span class="freccia">➜</span>
    <a href="https://csbno.cosedafare.net/corsi/intelligenza-artificiale/intelligenza-artificiale/intelligenza-artificiale-tre-prospettive-capire-cambiamento-6034.html" target="_blank">
      Intelligenza artificiale:
    </a>
    incontro gratuito in CSBNO
  </div>


  <!-- FRASE 3 -->
  <div class="frase">
    <span class="freccia">➜</span>
    <a href="https://comune.sestosangiovanni.mi.it/it/events/event/1156/raga-ci-sono-un-sacco-di-cose-da-fare" target="_blank">
      Attività per giovani 18-34 anni:
    </a>
    progetto R.AGA 2 - Reload AGA PLUS
  </div>


  <!-- FRASE 4 -->
  <div class="frase">
    <span class="freccia">➜</span>
    <a href="https://csbno.cosedafare.net/Corsi/Scienze%20sociali/Economia" target="_blank">
      Educazione finanziaria in biblioteca:
    </a>
    incontri gratuti da ottobre
  </div>

</div>

</body>
</html>
